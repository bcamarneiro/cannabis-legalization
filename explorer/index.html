<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Explorador Comparativo — Modelos Legislativos de Cannabis</title>
<style>
  :root { --bg:#f8f9fa; --card:#fff; --text:#212529; --muted:#6c757d; --border:#dee2e6; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--text); line-height:1.6; }
  header { background:#1a1a2e; color:#fff; padding:2rem 1rem; text-align:center; }
  header h1 { font-size:1.5rem; margin-bottom:.25rem; }
  header p { color:#adb5bd; font-size:.9rem; }
  .wrap { max-width:1200px; margin:0 auto; padding:1rem; }
  .controls { display:flex; flex-wrap:wrap; gap:.5rem; margin:1.5rem 0; justify-content:center; }
  .btn { border:2px solid transparent; padding:.5rem 1rem; border-radius:.5rem; cursor:pointer; font-weight:600; background:var(--card); color:var(--text); transition:.2s; }
  .btn:hover { transform:translateY(-1px); }
  .btn:focus-visible { outline:3px solid #4dabf7; outline-offset:2px; }
  .btn.active { color:#fff; }
  table { width:100%; border-collapse:collapse; background:var(--card); border-radius:.5rem; overflow:hidden; box-shadow:0 1px 3px rgba(0,0,0,.08); margin-bottom:2rem; }
  th,td { padding:.75rem 1rem; border-bottom:1px solid var(--border); text-align:left; vertical-align:top; }
  th { background:#f1f3f5; font-size:.75rem; text-transform:uppercase; letter-spacing:.03em; color:var(--muted); }
  tbody th:first-child { font-weight:600; width:22%; text-transform:none; font-size:inherit; background:transparent; }
  .cat-header { background:#e9ecef; font-weight:700; font-size:.85rem; color:#495057; }
  .cat-header td { padding:.5rem 1rem; }
  .badge { display:inline-block; font-size:.7rem; padding:.15rem .4rem; border-radius:.25rem; background:var(--bg); color:var(--muted); margin-left:.4rem; vertical-align:middle; }
  .sources { background:var(--card); border-radius:.5rem; padding:1.5rem; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .sources h2 { font-size:1.1rem; margin-bottom:1rem; }
  .country-sources { margin-bottom:1.5rem; }
  .country-sources h3 { font-size:.9rem; margin-bottom:.5rem; display:flex; align-items:center; gap:.4rem; }
  .dot { width:.6rem; height:.6rem; border-radius:50%; display:inline-block; }
  .country-sources ul { list-style:none; padding-left:0; font-size:.85rem; color:var(--muted); }
  .country-sources li { margin-bottom:.35rem; padding-left:1rem; text-indent:-1rem; }
  .country-sources li::before { content:"•"; margin-right:.5rem; color:var(--muted); }
  @media (max-width:800px) { tbody th:first-child { width:35%; } th,td { padding:.5rem; font-size:.85rem; } }
  @media (max-width:500px) { .controls { flex-direction:column; align-items:stretch; } }
</style>
</head>
<body>
<header>
  <h1>Explorador Comparativo de Modelos Legislativos</h1>
  <p>Portugal (proposta) · Alemanha · Canadá · Uruguai — atualizado Janeiro 2026</p>
</header>
<div class="wrap">
  <div class="controls" id="controls" role="group" aria-label="Seleção de países para comparação"></div>
  <table id="compareTable" aria-label="Tabela comparativa de modelos legislativos"><thead></thead><tbody></tbody></table>
  <div class="sources" id="sources" aria-label="Fontes e referências por país"></div>
</div>
<noscript>
  <div style="max-width:800px;margin:2rem auto;padding:1.5rem;background:#fff3cd;border:1px solid #ffc107;border-radius:.5rem;">
    <p><strong>JavaScript necessário:</strong> Este explorador interativo requer JavaScript para funcionar. Por favor, ative o JavaScript no seu navegador ou consulte os dados diretamente em <code>explorer/data.js</code>.</p>
  </div>
</noscript>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
