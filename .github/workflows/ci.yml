name: CI

on:
  pull_request:
    paths:
      - 'chapters/**'
      - 'references.bib'
      - 'scripts/**'
      - 'site/**'
      - 'assets/**'
      - 'tests/**'
      - 'ieee.csl'
      - '.github/workflows/**'
      - 'docs/heading-ids.lock'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require Signed-off-by (nome real) em cada commit
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for c in $(git rev-list --no-merges "origin/$BASE_REF..$HEAD_SHA"); do
            if ! git log -1 --format=%B "$c" | grep -qE '^Signed-off-by: .+ <.+>'; then
              echo "::error::Commit $(git log -1 --format='%h %s' "$c") sem Signed-off-by. Usa 'git commit -s' (nome real); ver CONTRIBUTING.md."
              missing=1
            fi
          done
          exit $missing

      - name: Install Pandoc and LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex texlive-fonts-recommended texlive-latex-extra
          pandoc --version | head -1

      - name: Guard published-ID lock (only release workflows may change it)
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --depth=1 origin "$BASE_REF"
          if ! git cat-file -e "origin/$BASE_REF:docs/heading-ids.lock" 2>/dev/null; then
            echo "O lock ainda não existe em $BASE_REF: primeira introdução, nada a comparar."
            exit 0
          fi
          if ! git diff --quiet "origin/$BASE_REF" -- docs/heading-ids.lock; then
            echo "::error file=docs/heading-ids.lock::docs/heading-ids.lock difere do branch base ($BASE_REF). Só os workflows de release (auto-release.yml / manual-release.yml) podem escrever este ficheiro; reverta as alterações a docs/heading-ids.lock neste PR."
            exit 1
          fi

      - name: Verify heading IDs and internal links
        run: python3 scripts/heading_ids.py check

      - name: Unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Build PDF, DOCX and site
        env:
          SKIP_PAGEFIND: '1'
        run: bash scripts/build.sh pdf docx site

      - name: Upload build for review
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: |
            output/*.pdf
            output/*.docx
            output/site
