name: Auto Release (PATCH)

on:
  push:
    branches: [main]
    paths:
      - 'references.bib'
      - 'chapters/**'

permissions:
  contents: write

jobs:
  auto-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Pandoc and LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex texlive-fonts-recommended texlive-latex-extra

      - name: Bump PATCH version
        id: version
        run: |
          chmod +x scripts/bump-version.sh
          NEW_VERSION=$(bash scripts/bump-version.sh patch)
          echo "version=${NEW_VERSION}" >> $GITHUB_OUTPUT
          echo "Bumped to version: ${NEW_VERSION}"

      - name: Commit version bump and heading lock
        run: |
          python3 scripts/heading_ids.py check
          python3 scripts/heading_ids.py lock
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION docs/heading-ids.lock
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: Bump version to ${{ steps.version.outputs.version }} [skip ci]"
            git push
          fi

      - name: Generate documento.md (release asset)
        run: bash scripts/merge-chapters.sh

      - name: Build PDF and DOCX
        run: bash scripts/build.sh

      - name: Get commit message
        id: commit
        run: |
          COMMIT_MSG=$(git log -1 --skip=1 --pretty=%B)
          echo "message<<EOF" >> $GITHUB_OUTPUT
          echo "${COMMIT_MSG}" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Update 'latest' tag
        run: |
          git tag -f latest
          git push -f origin latest

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Proposta Cannabis v${{ steps.version.outputs.version }}
          body: |
            ## 🤖 Release Automática (PATCH)

            **Versão:** `v${{ steps.version.outputs.version }}`
            **Tipo:** Correção técnica / Atualização menor

            **Última alteração:**
            ```
            ${{ steps.commit.outputs.message }}
            ```

            ### 📦 Ficheiros disponíveis:
            - 📄 `Regulacao_Cannabis_Portugal.pdf` - Versão PDF completa
            - 📝 `Regulacao_Cannabis_Portugal.docx` - Versão Word editável
            - 🧾 `documento.md` - Texto fonte concatenado (Markdown)

            ### 🔗 Links úteis:
            - [Ver alterações desde última release](../../compare/${{ github.event.before }}...${{ github.sha }})
            - [Ver documento fonte](../../tree/main/chapters)
            - [Ver referências bibliográficas](../../blob/main/references.bib)

            ---
            💡 **Nota:** Release automática gerada por alterações a `chapters/` ou `references.bib`.
            Para releases MINOR ou MAJOR, use o [workflow manual](../../actions/workflows/manual-release.yml).
          files: |
            output/Regulacao_Cannabis_Portugal.pdf
            output/Regulacao_Cannabis_Portugal.docx
            build/documento.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  site:
    needs: auto-release
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/site.yml
    with:
      ref: main
