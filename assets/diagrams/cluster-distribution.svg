<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
  <defs>
    <style>
      .title { font: bold 28px sans-serif; fill: #333; }
      .region-title { font: bold 18px sans-serif; fill: #fff; }
      .club-count { font: 14px sans-serif; fill: #fff; opacity: 0.9; }
      .root-text { font: bold 36px sans-serif; fill: #fff; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="800" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="600" y="50" text-anchor="middle" class="title">Distribuição Geográfica de Clubes - 46 Clubes</text>
  
  <!-- Central root node -->
  <circle cx="600" cy="120" r="70" fill="#2c3e50"/>
  <text x="600" y="115" text-anchor="middle" class="root-text">46 CLUBES</text>
  <text x="600" y="140" text-anchor="middle" class="root-text" style="font-size: 20px">PORTUGAL</text>
  
  <!-- Lisboa region (red) -->
  <g transform="translate(200, 250)">
    <rect x="-100" y="-50" width="200" height="120" rx="10" fill="#ff6b6b"/>
    <text x="0" y="-15" text-anchor="middle" class="region-title">LISBOA (AML)</text>
    <text x="0" y="10" text-anchor="middle" class="club-count">9 clubes</text>
    <text x="0" y="35" text-anchor="middle" class="club-count" style="font-size: 12px">Lisboa: 4 | Amadora: 1 | Oeiras: 1</text>
    <text x="0" y="50" text-anchor="middle" class="club-count" style="font-size: 12px">Cascais: 1 | Sintra: 1</text>
    <line x1="0" y1="-50" x2="0" y2="-80" stroke="#ff6b6b" stroke-width="3"/>
  </g>
  
  <!-- Porto region (blue) -->
  <g transform="translate(1000, 250)">
    <rect x="-100" y="-50" width="200" height="120" rx="10" fill="#4dabf7"/>
    <text x="0" y="-15" text-anchor="middle" class="region-title">PORTO (AMP)</text>
    <text x="0" y="10" text-anchor="middle" class="club-count">8 clubes</text>
    <text x="0" y="35" text-anchor="middle" class="club-count" style="font-size: 12px">Porto: 3 | V.N. Gaia: 2</text>
    <text x="0" y="50" text-anchor="middle" class="club-count" style="font-size: 12px">Matosinhos: 1 | Gondomar: 1</text>
    <line x1="0" y1="-50" x2="0" y2="-80" stroke="#4dabf7" stroke-width="3"/>
  </g>
  
  <!-- Centro region (green) -->
  <g transform="translate(300, 450)">
    <rect x="-100" y="-50" width="200" height="120" rx="10" fill="#51cf66"/>
    <text x="0" y="-15" text-anchor="middle" class="region-title">CENTRO</text>
    <text x="0" y="10" text-anchor="middle" class="club-count">10 clubes</text>
    <text x="0" y="35" text-anchor="middle" class="club-count" style="font-size: 12px">Aveiro: 3 | Coimbra: 2 | Leiria: 2</text>
    <text x="0" y="50" text-anchor="middle" class="club-count" style="font-size: 12px">Viseu: 1 | Santarém: 2</text>
    <line x1="0" y1="-50" x2="0" y2="-80" stroke="#51cf66" stroke-width="3"/>
  </g>
  
  <!-- Norte region (yellow) -->
  <g transform="translate(900, 450)">
    <rect x="-100" y="-50" width="200" height="120" rx="10" fill="#ffd43b"/>
    <text x="0" y="-15" text-anchor="middle" class="region-title" style="fill: #000">NORTE</text>
    <text x="0" y="10" text-anchor="middle" class="club-count" style="fill: #000">9 clubes</text>
    <text x="0" y="35" text-anchor="middle" class="club-count" style="font-size: 12px; fill: #000">Braga: 4 | Viana Castelo: 1</text>
    <text x="0" y="50" text-anchor="middle" class="club-count" style="font-size: 12px; fill: #000">Vila Real: 1 | Bragança: 1</text>
    <line x1="0" y1="-50" x2="0" y2="-80" stroke="#ffd43b" stroke-width="3"/>
  </g>
  
  <!-- Sul region (purple) -->
  <g transform="translate(400, 650)">
    <rect x="-100" y="-50" width="200" height="120" rx="10" fill="#cc5de8"/>
    <text x="0" y="-15" text-anchor="middle" class="region-title">SUL</text>
    <text x="0" y="10" text-anchor="middle" class="club-count">7 clubes</text>
    <text x="0" y="35" text-anchor="middle" class="club-count" style="font-size: 12px">Setúbal: 4 | Faro/Algarve: 2</text>
    <text x="0" y="50" text-anchor="middle" class="club-count" style="font-size: 12px">Évora: 1</text>
    <line x1="0" y1="-50" x2="0" y2="-80" stroke="#cc5de8" stroke-width="3"/>
  </g>
  
  <!-- Interior region (light blue) -->
  <g transform="translate(700, 650)">
    <rect x="-100" y="-50" width="200" height="120" rx="10" fill="#74c0fc"/>
    <text x="0" y="-15" text-anchor="middle" class="region-title">INTERIOR</text>
    <text x="0" y="10" text-anchor="middle" class="club-count">4 clubes</text>
    <text x="0" y="35" text-anchor="middle" class="club-count" style="font-size: 12px">Guarda: 1 | Castelo Branco: 1</text>
    <text x="0" y="50" text-anchor="middle" class="club-count" style="font-size: 12px">Portalegre: 1 | Beja: 1</text>
    <line x1="0" y1="-50" x2="0" y2="-80" stroke="#74c0fc" stroke-width="3"/>
  </g>
  
  <!-- Ilhas region (orange) -->
  <g transform="translate(600, 750)">
    <rect x="-80" y="-40" width="160" height="90" rx="10" fill="#ffa94d"/>
    <text x="0" y="-10" text-anchor="middle" class="region-title" style="fill: #000">ILHAS</text>
    <text x="0" y="15" text-anchor="middle" class="club-count" style="fill: #000">2 clubes</text>
    <text x="0" y="35" text-anchor="middle" class="club-count" style="font-size: 12px; fill: #000">Madeira: 1 | Açores: 1</text>
    <line x1="0" y1="-40" x2="0" y2="-60" stroke="#ffa94d" stroke-width="3"/>
  </g>
  
  <!-- Connecting lines from root -->
  <line x1="600" y1="190" x2="200" y2="200" stroke="#ccc" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="600" y1="190" x2="1000" y2="200" stroke="#ccc" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="600" y1="190" x2="300" y2="350" stroke="#ccc" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="600" y1="190" x2="900" y2="350" stroke="#ccc" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="600" y1="190" x2="400" y2="550" stroke="#ccc" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="600" y1="190" x2="700" y2="550" stroke="#ccc" stroke-width="2" stroke-dasharray="5,5"/>
  
  <!-- Legend -->
  <g transform="translate(50, 750)">
    <text x="0" y="0" style="font: 12px sans-serif; fill: #666">Rácio: 1 clube per 234.000 habitantes (baseado em 10.75M população PT)</text>
  </g>
</svg>
